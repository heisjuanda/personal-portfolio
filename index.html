  <!-- Google Analytics with Consent Mode v2.
       Runs synchronously and before the tag itself, so no identifier is ever
       written on a visit that has not answered the notice. The tag is only
       requested once consent has actually been granted: a visitor who declines,
       or who never answers, causes zero requests to googletagmanager.com. -->
  <script>
    (function () {
      var STORAGE_KEY = "juanda:analytics-consent";
      var GA_ID = "%VITE_GA4_ID%";
      var isConfigured = GA_ID.indexOf("G-") === 0;

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };

      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied"
      });

      var stored = null;
      try { stored = window.localStorage.getItem(STORAGE_KEY); } catch (e) { }

      var tagLoaded = false;

      function loadTag() {
        if (tagLoaded || !isConfigured) return;
        tagLoaded = true;

        window.removeEventListener("scroll", loadTag);
        window.removeEventListener("mousemove", loadTag);
        window.removeEventListener("touchstart", loadTag);

        var script = document.createElement("script");
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
        document.head.appendChild(script);

        gtag("js", new Date());
        gtag("config", GA_ID, {
          anonymize_ip: true,
          page_path: window.location.pathname
        });
      }

      // Returning visitor who already said yes: keep the original lazy trigger
      // so the tag never competes with the first paint.
      function loadTagWhenIdle() {
        window.addEventListener("scroll", loadTag, { passive: true });
        window.addEventListener("mousemove", loadTag, { passive: true });
        window.addEventListener("touchstart", loadTag, { passive: true });
        setTimeout(loadTag, 2000);
      }

      if (stored === "granted") {
        gtag("consent", "update", { analytics_storage: "granted" });
        loadTagWhenIdle();
      }

      window.__analyticsConsent = {
        storageKey: STORAGE_KEY,
        stored: stored,
        isConfigured: isConfigured,
        update: function (granted) {
          gtag("consent", "update", {
            analytics_storage: granted ? "granted" : "denied"
          });
          // Answered from the notice, so the visitor is already interacting:
          // load now instead of waiting for the idle trigger.
          if (granted) loadTag();
        }
      };
    })();
  </script>
